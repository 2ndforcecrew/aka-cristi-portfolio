  <script>
    /* ============================================================
     * AKA.CRISTI — contact.html 内联逻辑
     * 无后端：前端校验 → 拼 mailto → location.href。
     * ============================================================ */
    (function () {
      'use strict';
      function byHook(name, root) {
        return (root || document).querySelector('[data-js="' + name + '"]');
      }
      function T(key) {
        return (window.AKA && AKA.i18n && AKA.i18n.t) ? AKA.i18n.t(key) : key;
      }
      function isEn() {
        return !!(window.AKA && AKA.i18n && AKA.i18n.lang === 'en');
      }
      function init() {
        var form = byHook('inquiry-form');
        if (!form) return;
        var fields = {
          name: { input: byHook('input-name', form), err: byHook('err-name', form), wrap: byHook('field-name', form) },
          email: { input: byHook('input-email', form), err: byHook('err-email', form), wrap: byHook('field-email', form) },
          type: { input: byHook('input-type', form), err: byHook('err-type', form), wrap: byHook('field-type', form) },
          message: { input: byHook('input-message', form), err: byHook('err-message', form), wrap: byHook('field-message', form) }
        };
        var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        function validate() {
          var ok = true;
          var vals = {};
          ['name', 'email', 'type', 'message'].forEach(function (k) {
            var f = fields[k];
            if (!f || !f.input) return;
            var v = f.input.value.trim();
            vals[k] = v;
            var bad = !v || (k === 'email' && !EMAIL_RE.test(v));
            if (f.wrap) f.wrap.classList.toggle('is-invalid', !!bad);
            if (f.err) f.err.textContent = k === 'email' && v && !EMAIL_RE.test(v)
              ? T('contact.errEmail')
              : T('contact.errRequired');
            if (bad) ok = false;
          });
          return ok ? vals : null;
        }
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var vals = validate();
          if (!vals) return;
          var en = isEn();
          var subject = en
            ? 'AKA.CRISTI — Project Inquiry — ' + vals.name + ' / ' + vals.type
            : 'AKA.CRISTI — 项目询价 — ' + vals.name + ' / ' + vals.type;
          var body = en
            ? 'NAME\n' + vals.name + '\n\nEMAIL\n' + vals.email +
              '\n\nPROJECT TYPE\n' + vals.type + '\n\nMESSAGE\n' + vals.message
            : '姓名\n' + vals.name + '\n\n邮箱\n' + vals.email +
              '\n\n项目类型\n' + vals.type + '\n\n留言\n' + vals.message;
          location.href = 'mailto:akacristi@gmail.com?subject=' +
            encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
