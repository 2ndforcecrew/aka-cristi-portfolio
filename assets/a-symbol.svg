<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -20 312 432" role="img" aria-label="AKA.CRISTI A symbol">
  <!-- 斷裂 A · 400u 網格手繪幾何（DESIGN-v3 精確參數）
       雙腿 64u 筆畫：左 (102,400)-(216,40)，右 (330,400)-(216,40)
       斷裂：y 246–272 橫向 26u 切口，上半截右移 28u
       針尖：22u 寬，自頂點 (244,40) 向上至 y=-8
       懸浮方點：18u，中心 (216,335) -->
  <defs>
    <clipPath id="a-upper">
